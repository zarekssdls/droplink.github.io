<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/assets/styles.css"><script src="/assets/config.js"></script><title>Servers · Droplink</title></head>
<body>
<div id="app" class="app">
  <main>
    <div class="page-head">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap">
        <div>
          <div class="eyebrow" style="margin-bottom:8px">Dashboard</div>
          <h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-.02em">Game Servers</h1>
          <p class="muted" style="margin-top:6px">Manage your servers and their subdomains.</p>
        </div>
        <button id="newServerBtn" class="btn btn-primary"><i data-lucide="plus" style="width:16px;height:16px"></i> New Server</button>
      </div>
      <div class="toolbar"><div id="domainSelector"></div></div>
    </div>

    <div class="page-body">
      <div id="loading" style="text-align:center;padding:60px 0"><div class="spinner"></div><p class="muted" style="margin-top:12px">Loading...</p></div>
      <div id="empty" hidden style="text-align:center;padding:60px 24px;border:1px dashed var(--border);border-radius:16px">
        <i data-lucide="server" style="width:36px;height:36px;color:var(--muted-2)"></i>
        <h2 style="font-size:1.125rem;font-weight:700;margin-top:14px">No servers yet</h2>
        <p class="muted" style="margin-top:6px;margin-bottom:18px">Create your first server to get a clean subdomain.</p>
        <button id="emptyCreateBtn" class="btn btn-primary"><i data-lucide="plus" style="width:16px;height:16px"></i> Create Server</button>
      </div>
      <div id="list" class="server-grid"></div>
    </div>
  </main>
</div>

<div id="modal" hidden class="modal-back">
  <div class="modal">
    <h2>Create new server</h2>
    <form id="newServerForm" style="display:flex;flex-direction:column;gap:14px">
      <div><label class="label">Server name</label><input class="input" name="name" required placeholder="My game server"></div>
      <div>
        <label class="label">Game type</label>
        <div class="row-2" id="gameTypes"></div>
        <input type="hidden" name="gameType" id="gameTypeInput" value="minecraft">
      </div>
      <div class="row-2">
        <div><label class="label">Max players</label><input class="input" type="number" min="1" name="maxPlayers" value="32" required></div>
        <div><label class="label">Domain</label><select class="select" name="domain" id="modalDomain" required><option value="">Select...</option></select></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button type="button" id="cancelBtn" class="btn btn-secondary" style="flex:1;justify-content:center">Cancel</button>
        <button type="submit" id="submitBtn" class="btn btn-primary" style="flex:1;justify-content:center">Create</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { api, requireAuth } from '/assets/api.js';
  import { mountShell } from '/assets/dashboard-shell.js';
  requireAuth();
  mountShell('/dashboard');

  const state = { selectedDomain:'', domains:[] };

  async function loadDomains() {
    try {
      state.domains = await api('/domains');
      renderDomainSelector();
      document.getElementById('modalDomain').innerHTML =
        '<option value="">Select a domain...</option>' +
        state.domains.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
      if (!state.selectedDomain && state.domains[0]) state.selectedDomain = state.domains[0].name;
    } catch {}
    loadServers();
  }

  function renderDomainSelector() {
    const c = document.getElementById('domainSelector');
    const sel = document.createElement('select');
    sel.className = 'select'; sel.style.maxWidth = '260px';
    sel.innerHTML = '<option value="">All domains</option>' +
      state.domains.map(d => `<option value="${d.name}" ${d.name===state.selectedDomain?'selected':''}>${d.name}</option>`).join('');
    sel.addEventListener('change', e => { state.selectedDomain = e.target.value; loadServers(); });
    c.replaceChildren(sel);
  }

  async function loadServers() {
    const L=document.getElementById('loading'), E=document.getElementById('empty'), list=document.getElementById('list');
    L.hidden=false; E.hidden=true; list.replaceChildren();
    try {
      const q = state.selectedDomain ? '?domain='+encodeURIComponent(state.selectedDomain) : '';
      const servers = await api('/servers'+q);
      L.hidden=true;
      if (!servers.length) { E.hidden=false; lucide.createIcons(); return; }
      list.innerHTML = servers.map(card).join('');
      list.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
        navigator.clipboard.writeText(b.dataset.copy);
        b.innerHTML = '<i data-lucide="check" style="width:14px;height:14px"></i> Copied'; lucide.createIcons();
        setTimeout(() => { b.innerHTML = '<i data-lucide="copy" style="width:14px;height:14px"></i> Copy'; lucide.createIcons(); }, 1500);
      }));
      list.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('Delete this server?')) return;
        await api('/servers/'+b.dataset.delete, { method:'DELETE' });
        loadServers();
      }));
      lucide.createIcons();
    } catch { L.hidden=true; list.innerHTML='<p class="muted">Failed to load servers.</p>'; }
  }

  function card(s) {
    const onClass = s.status==='online' ? 'badge-online' : 'badge-offline';
    const dot = s.status==='online' ? 'dot-on' : 'dot-off';
    return `<div class="server-card">
      <div class="server-head">
        <div>
          <div style="display:flex;align-items:center;gap:10px"><span class="dot ${dot}"></span><div class="server-title">${s.name}</div></div>
          <div class="server-meta">
            <span class="badge">${(s.gameType||'').toUpperCase()}</span>
            <span class="badge">${s.players||0}/${s.maxPlayers} players</span>
            <span class="badge ${onClass}">${s.status}</span>
          </div>
        </div>
        <button class="btn btn-danger" data-delete="${s._id}" style="padding:.45rem .65rem"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>
      </div>
      <div style="background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div style="min-width:0">
          <div class="eyebrow" style="font-size:10px;margin-bottom:4px">Connect with</div>
          <code style="font-size:.9rem">${s.subdomain}.${s.domain}</code>
        </div>
        <button class="btn btn-secondary" data-copy="${s.subdomain}.${s.domain}:${s.port||25565}" style="padding:.45rem .7rem;font-size:.8rem">
          <i data-lucide="copy" style="width:14px;height:14px"></i> Copy
        </button>
      </div>
      <div class="row-2" style="font-size:.875rem">
        <div><div class="eyebrow" style="font-size:10px;margin-bottom:2px">IP</div><code>${s.ip}</code></div>
        <div><div class="eyebrow" style="font-size:10px;margin-bottom:2px">Port</div><code>${s.port||25565}</code></div>
      </div>
    </div>`;
  }

  // Game type buttons
  const games=[{id:'minecraft',name:'Minecraft'},{id:'csgo',name:'CS:GO/CS2'},{id:'rust',name:'Rust'},{id:'valheim',name:'Valheim'}];
  const gtBox = document.getElementById('gameTypes');
  gtBox.innerHTML = games.map(g => `<button type="button" data-gt="${g.id}" class="type-btn">${g.name}</button>`).join('');
  function selectGT(id){document.getElementById('gameTypeInput').value=id;gtBox.querySelectorAll('[data-gt]').forEach(b=>b.classList.toggle('on',b.dataset.gt===id));}
  selectGT('minecraft');
  gtBox.addEventListener('click', e => { const t=e.target.closest('[data-gt]'); if (t) selectGT(t.dataset.gt); });

  const modal = document.getElementById('modal');
  document.getElementById('newServerBtn').addEventListener('click', () => modal.hidden=false);
  document.getElementById('emptyCreateBtn').addEventListener('click', () => modal.hidden=false);
  document.getElementById('cancelBtn').addEventListener('click', () => modal.hidden=true);

  document.getElementById('newServerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Creating...';
    const fd=new FormData(e.currentTarget);
    try {
      await api('/servers', { method:'POST', body: JSON.stringify({
        name: fd.get('name'), gameType: fd.get('gameType'),
        maxPlayers: Number(fd.get('maxPlayers')), domain: fd.get('domain'),
      })});
      modal.hidden=true; e.currentTarget.reset(); selectGT('minecraft'); loadServers();
    } catch (err) { alert('Failed: '+err.message); }
    finally { btn.disabled=false; btn.textContent='Create'; }
  });

  loadDomains();
</script>
</body></html>
