<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Droplink</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="landing-page">
  <nav class="landing-nav">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 34px; height: 34px; background: linear-gradient(135deg, #d0d0d0 0%, #a8a8a8 50%, #b8b8b8 100%); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0a0a0c; font-size: 15px;">D</div>
      <span style="font-size: 19px; font-weight: 800; background: linear-gradient(135deg, #d0d0d0 0%, #a8a8a8 50%, #b8b8b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Droplink</span>
    </div>
    <div class="nav-links">
      <a href="../index.html#features">Features</a>
      <a href="../index.html#pricing">Pricing</a>
      <a href="docs.html">Docs</a>
      <a href="../auth/login.html" class="btn-primary" style="padding:9px 18px;font-size:13px;">Login</a>
    </div>
  </nav>

  <section style="max-width: 600px; margin: 60px auto; padding: 0 24px;">
    <h1 style="font-size: 42px; font-weight: 900; color: var(--text-primary); margin-bottom: 20px; text-align: center;">Contact Us</h1>
    
    <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px;">
      
      <form id="contactForm">
        <div class="form-group">
          <label>Name</label>
          <input type="text" class="form-input" id="name" placeholder="Your name" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-input" id="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label>Subject</label>
          <input type="text" class="form-input" id="subject" placeholder="How can we help?" required>
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea class="form-input" id="message" placeholder="Your message..." style="resize: vertical; min-height: 150px;" required></textarea>
        </div>

        <button type="submit" class="btn-primary btn-block">Send Message</button>
      </form>

      <div style="margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--border); text-align: center;">
        <h3 style="font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px;">Other Ways to Reach Us</h3>
        <p style="color: var(--text-muted); margin-bottom: 12px;">
          <strong>Email:</strong> support@droplink.gg
        </p>
        <p style="color: var(--text-muted);">
          <strong>Discord:</strong> Join our community server
        </p>
      </div>
    </div>
  </section>

  <footer style="text-align: center; padding: 40px 20px; border-top: 1px solid #333333; color: #808080; font-size: 13px; margin-top: 60px;">
    <p>&copy; 2026 Droplink. All rights reserved.</p>
  </footer>

  <script src="../assets/app.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const subject = document.getElementById('subject').value;
      const message = document.getElementById('message').value;

      try {
        showLoading();
        
        // This would normally send to your backend
        // await api.post('/contact', { name, email, subject, message });
        
        showToast('Message sent successfully! We\'ll get back to you soon.', 'success');
        document.getElementById('contactForm').reset();
      } catch (err) {
        showToast(err.message || 'Failed to send message', 'error');
      } finally {
        hideLoading();
      }
    });
  </script>
</body>
</html>
